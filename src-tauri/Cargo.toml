[package]
name = "ft891-monitor"
version = "0.1.0"
description = "Desktop CAT monitor and remote panel for the Yaesu FT-891"
authors = ["Yoram (4Z1YR)"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ft891_monitor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ft891-cat = { path = "../crates/ft891-cat" }
