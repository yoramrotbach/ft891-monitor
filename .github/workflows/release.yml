# Builds installers for 891 Monitor for Windows, macOS (Apple Silicon + Intel), Linux x64 and
# Linux arm64 (Raspberry Pi 4/5, 64-bit OS) and attaches them to a draft
# GitHub release. Trigger: push a tag like v0.1.0, or run it manually from the
# Actions tab with a version (GitHub then creates the tag on the current commit).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm # Raspberry Pi OS 64-bit (Bookworm)
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - name: Unit tests
        run: cargo test --workspace

      - name: Build 891 Monitor
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          releaseName: "891 Monitor ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          releaseBody: "891 Monitor: FT-891 LCD look-alike with basic remote control. See the README for install notes. Builds are unsigned, so Windows SmartScreen and macOS Gatekeeper will warn on first launch."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

